name: Release

# Pushing a version tag builds Atelier for Windows and publishes it as a
# GitHub release. The tag must match the workspace version in Cargo.toml.
#   v0.2.0          -> stable channel
#   v0.2.0-beta.1   -> preview channel (marked as a pre-release)
# The app's updater reads these releases (see crates/atelier-app/src/update.rs)
# and relies on the asset names below, so keep them stable.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            Write-Error "Tag $tag does not match the version $version in Cargo.toml"
            exit 1
          }

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release -p atelier-app -p atelier-cli

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\atelier.iss

      - name: Gather the files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\atelier-viewer.exe dist\atelier-windows-x64.exe
          Copy-Item target\release\atelier.exe dist\atelier-cli-windows-x64.exe
          Copy-Item installer\Output\atelier-setup.exe dist\atelier-setup-windows-x64.exe
          Compress-Archive -Path target\release\atelier-viewer.exe, target\release\atelier.exe -DestinationPath "dist\Atelier-$version-windows-x64.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pre = if ($tag.Contains("-")) { "--prerelease" } else { "--latest" }
          gh release create $tag (Get-ChildItem dist -File).FullName --title "Atelier $($tag.TrimStart('v'))" --generate-notes $pre
