name: CI

on:
  push:
    branches: [main, prerelease]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Use OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sh tools/setup_linux.sh
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build -p atelier-app -p atelier-cli
      - name: PDF repair and render smoke corpus
        run: python tools/qa_pdf_edges.py "${{ runner.temp }}/atelier-pdf-qa"
