[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0-beta.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
atelier-color = { path = "crates/atelier-color" }
atelier-crypto = { path = "crates/atelier-crypto" }
atelier-filters = { path = "crates/atelier-filters" }
atelier-font = { path = "crates/atelier-font" }
atelier-form = { path = "crates/atelier-form" }
atelier-syntax = { path = "crates/atelier-syntax" }
atelier-raster = { path = "crates/atelier-raster" }
atelier-render = { path = "crates/atelier-render" }
atelier-script = { path = "crates/atelier-script" }
atelier-ocr = { path = "crates/atelier-ocr" }
atelier-print = { path = "crates/atelier-print" }
atelier-view = { path = "crates/atelier-view" }
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1

# The image codecs are unusably slow unoptimised; keep them fast in debug
# builds and tests too.
[profile.dev.package.atelier-filters]
opt-level = 2

