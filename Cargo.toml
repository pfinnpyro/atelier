[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.2.2"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
atelier-color = { path = "crates/atelier-color" }
atelier-crypto = { path = "crates/atelier-crypto" }
atelier-filters = { path = "crates/atelier-filters" }
atelier-font = { path = "crates/atelier-font" }
atelier-form = { path = "crates/atelier-form" }
atelier-pgp = { path = "crates/atelier-pgp" }
atelier-syntax = { path = "crates/atelier-syntax" }
atelier-raster = { path = "crates/atelier-raster" }
atelier-render = { path = "crates/atelier-render" }
atelier-script = { path = "crates/atelier-script" }
atelier-ocr = { path = "crates/atelier-ocr" }
atelier-print = { path = "crates/atelier-print" }
atelier-view = { path = "crates/atelier-view" }
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
# The renderer is all Atelier's own code spread over many crates; letting
# the compiler see across them is worth the longer release build.
lto = "thin"
codegen-units = 1

# The image codecs are unusably slow unoptimised; keep them fast in debug
# builds and tests too.
[profile.dev.package.atelier-filters]
opt-level = 2

# Keep the first page and OCR responsive in local viewer builds.
[profile.dev.package.atelier-render]
opt-level = 2

[profile.dev.package.atelier-raster]
opt-level = 2

[profile.dev.package.atelier-syntax]
opt-level = 2

[profile.dev.package.atelier-view]
opt-level = 2

[profile.dev.package.atelier-ocr]
opt-level = 2

[profile.dev.package.ocrs]
opt-level = 2

[profile.dev.package.rten]
opt-level = 2

[profile.dev.package.rten-gemm]
opt-level = 2

[profile.dev.package.rten-imageproc]
opt-level = 2

[profile.dev.package.rten-simd]
opt-level = 2

[profile.dev.package.rten-tensor]
opt-level = 2

[profile.dev.package.rten-vecmath]
opt-level = 2

# Unlocking an encrypted profile hashes its passphrase hundreds of
# thousands of times, which would take most of a minute unoptimised.
[profile.dev.package.atelier-crypto]
opt-level = 2

# Training the field models in their tests is a lot of arithmetic.
[profile.dev.package.atelier-fieldml]
opt-level = 2

# OpenPGP stretches a passphrase by hashing 65 MB, and seals whole files.
[profile.dev.package.atelier-pgp]
opt-level = 2
