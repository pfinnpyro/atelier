[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
atelier-filters = { path = "crates/atelier-filters" }
atelier-font = { path = "crates/atelier-font" }
atelier-syntax = { path = "crates/atelier-syntax" }
atelier-raster = { path = "crates/atelier-raster" }
atelier-render = { path = "crates/atelier-render" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
