[package]
name = "atelier-cli"
description = "Command-line tool for inspecting PDFs with the Atelier engine"
version.workspace = true
edition.workspace = true
# OCR's runtime needs a newer compiler than the library crates.
rust-version = "1.94"
publish.workspace = true

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
atelier-filters.workspace = true
atelier-form.workspace = true
atelier-ocr.workspace = true
atelier-render.workspace = true
atelier-syntax.workspace = true
atelier-view.workspace = true

[lints]
workspace = true
