[package]
name = "atelier-app"
description = "The Atelier PDF viewer"
version.workspace = true
edition.workspace = true
# eframe needs a newer compiler than the library crates.
rust-version = "1.95"
publish.workspace = true

[[bin]]
name = "atelier-viewer"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
atelier-crypto.workspace = true
atelier-form.workspace = true
atelier-raster.workspace = true
atelier-render.workspace = true
atelier-script.workspace = true
atelier-syntax.workspace = true
atelier-ocr.workspace = true
atelier-print.workspace = true
atelier-view.workspace = true
eframe = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
rfd = "0.17"
# Already part of eframe; used directly to read the clipboard for Paste.
arboard = { version = "3.6", default-features = false }
image = "0.25.10"

# The workspace forbids unsafe code; this crate only denies it, so the one
# module that talks to AppKit (`macos.rs`) can allow it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target."cfg(windows)".dependencies]
winreg = "0.55"

[target."cfg(target_os = \"macos\")".dependencies]
# The menu bar.
muda = { version = "0.21", default-features = false }
# Finder's open-document events, which winit does not pass on.
objc2 = "0.6"
# To measure the traffic lights through eframe.
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "NSURL", "NSObject"] }
